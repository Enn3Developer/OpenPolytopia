name: Claude PR Summary

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-summary:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so `git diff origin/<base>...HEAD` works.
          fetch-depth: 0

      - name: Post PR summary
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress forces tag mode: the action creates a comment as
          # claude[bot] before Claude runs and gives it
          # mcp__github_comment__update_claude_comment to fill it in.
          # use_sticky_comment reuses that comment on every push instead of
          # spamming a new one.
          track_progress: true
          use_sticky_comment: true
          prompt: |
            Write a short summary of this pull request for a reviewer who has not read it.

            Inspect the actual changes with `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`
            (and `gh pr diff ${{ github.event.pull_request.number }}` if needed). Do not trust the PR
            title or description alone, and do not modify any files.

            Then replace the tracking comment with this exact structure (no progress checklist,
            no preamble, no closing remarks):

            ## Summary
            One or two sentences on what the PR does and why.

            ## Changes
            - 3 to 6 bullets, each one concrete change, grouped by area (e.g. server, client, CI, tests).

            ## Worth a look
            - 0 to 3 bullets on things a reviewer should pay attention to: behaviour changes,
              migrations, removed public API, missing tests. Omit this section if there is nothing.

            Keep it under 200 words. No code review, no praise, no findings.
          claude_args: >-
            --max-turns 15
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit"
